<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- wall plate (same style as ethernet-socket.svg) -->
  <rect x="50" y="50" width="300" height="300" rx="30" fill="#eef1f5"/>
  <rect x="50" y="50" width="300" height="300" rx="30" fill="none" stroke="#cfd6df" stroke-width="3"/>
  <!-- screws -->
  <circle cx="200" cy="88" r="9" fill="#cfd6df"/>
  <rect x="193" y="86" width="14" height="4" rx="2" fill="#9aa4b2"/>
  <circle cx="200" cy="312" r="9" fill="#cfd6df"/>
  <rect x="193" y="310" width="14" height="4" rx="2" fill="#9aa4b2"/>
  <!-- RJ11 phone port: narrower than RJ45, small latch notch -->
  <path d="M152 162 H184 V148 H216 V162 H248 V246 H152 Z" fill="#c4ccd6" stroke="#c4ccd6" stroke-width="18" stroke-linejoin="round"/>
  <path d="M152 162 H184 V148 H216 V162 H248 V246 H152 Z" fill="#1c1f26" stroke="#1c1f26" stroke-width="4" stroke-linejoin="round"/>
  <!-- 4 contacts -->
  <g fill="#d4aa3c">
    <rect x="167" y="212" width="9" height="28" rx="2"/>
    <rect x="186" y="212" width="9" height="28" rx="2"/>
    <rect x="205" y="212" width="9" height="28" rx="2"/>
    <rect x="224" y="212" width="9" height="28" rx="2"/>
  </g>
  <!-- small handset mark under the port -->
  <path d="M176 284 q4 -10 14 -10 h20 q10 0 14 10 l-8 4 q-3 -6 -8 -6 h-16 q-5 0 -8 6 z" fill="#9aa4b2"/>
</svg>
